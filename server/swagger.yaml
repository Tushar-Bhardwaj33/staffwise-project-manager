openapi: 3.0.3
info:
  title: Staffwise API
  description: >
    API for Staffwise — a company platform for staffing projects with the
    right employees, via role-based Admin/Employee access, Teams, and an
    AI assistant.
  version: 1.0.0

servers:
  - url: /api
    description: Local development (relative to current host)
  - url: https://staffwise.onrender.com/api
    description: Production (Render)

tags:
  - name: Auth
  - name: Users
  - name: Teams
  - name: Projects
  - name: Teams on Projects
  - name: Preferences
  - name: Documents
  - name: Discussions
  - name: History
  - name: AI

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: token
      description: JWT issued on register/login and stored in a `token` cookie (httpOnly).

  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
          example: Something went wrong

    User:
      type: object
      properties:
        _id:
          type: string
          example: 507f1f77bcf86cd799439011
        name:
          type: string
          example: Tushar Bhardwaj
        email:
          type: string
          format: email
          example: tushar@staffwise.com
        role:
          type: string
          enum: [admin, employee]
        employeeId:
          type: number
          example: 1433
        skills:
          type: array
          items:
            type: string
          example: [React, Node.js, TypeScript]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Team:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
          example: Dev Team
        members:
          type: array
          items:
            oneOf:
              - type: string
              - $ref: '#/components/schemas/User'
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Project:
      type: object
      properties:
        _id:
          type: string
        title:
          type: string
          example: Internal Analytics Dashboard
        description:
          type: string
        type:
          type: string
          enum: [personal, company, product, client]
        requiredSkills:
          type: array
          items:
            type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        assignedTeams:
          type: array
          items:
            oneOf:
              - type: string
              - $ref: '#/components/schemas/Team'
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Preference:
      type: object
      properties:
        _id:
          type: string
        project:
          type: string
        employee:
          oneOf:
            - type: string
            - type: object
              properties:
                _id:
                  type: string
                name:
                  type: string
                email:
                  type: string
                employeeId:
                  type: number
                skills:
                  type: array
                  items:
                    type: string
        interest:
          type: string
          enum: [interested, not-interested]
        reason:
          type: string
        createdAt:
          type: string
          format: date-time

    ProjectDocument:
      type: object
      properties:
        _id:
          type: string
        project:
          type: string
        title:
          type: string
        filename:
          type: string
        mimeType:
          type: string
        size:
          type: integer
        uploadedBy:
          type: string
        createdAt:
          type: string
          format: date-time

    Comment:
      type: object
      properties:
        _id:
          type: string
        project:
          type: string
        author:
          type: string
        title:
          type: string
          nullable: true
        content:
          type: string
        parentComment:
          type: string
          nullable: true
        upvotes:
          type: array
          items:
            type: string
        isPinned:
          type: boolean
        createdAt:
          type: string
          format: date-time

    Reflection:
      type: object
      properties:
        _id:
          type: string
        employeeId:
          type: string
        projectId:
          type: string
        whatBuilt:
          type: string
        whatWentWell:
          type: string
        whatWentWrong:
          type: string
        skillsGainedOrUsed:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time

    Validation:
      type: object
      properties:
        _id:
          type: string
        adminId:
          type: string
        employeeId:
          type: string
        projectId:
          type: string
        performanceScores:
          type: object
          properties:
            technical:
              type: number
            collaboration:
              type: number
            ownership:
              type: number
        skillValidation:
          type: array
          items:
            type: string
        qualitativeNote:
          type: string
        createdAt:
          type: string
          format: date-time

    DiscussionTopic:
      type: object
      properties:
        _id:
          type: string
        project:
          type: string
        author:
          type: string
        title:
          type: string
        content:
          type: string
        upvotes:
          type: array
          items:
            type: string
        isPinned:
          type: boolean
        createdAt:
          type: string
          format: date-time

    DiscussionComment:
      type: object
      properties:
        _id:
          type: string
        topic:
          type: string
        parentComment:
          type: string
          nullable: true
        replyingToAuthor:
          type: string
          nullable: true
        author:
          oneOf:
            - type: string
            - type: object
              properties:
                _id:
                  type: string
                name:
                  type: string
                avatar:
                  type: string
                  nullable: true
        content:
          type: string
        upvotes:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time

    ThreadedComment:
      allOf:
        - $ref: '#/components/schemas/DiscussionComment'
        - type: object
          properties:
            replies:
              type: array
              items:
                $ref: '#/components/schemas/DiscussionComment'

    Candidate:
      type: object
      properties:
        employee:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            employeeId:
              type: number
            skills:
              type: array
              items:
                type: string
        score:
          type: number
        matchedSkills:
          type: array
          items:
            type: string
        preference:
          type: string
          enum: [interested, not-interested, no-response]
        available:
          type: boolean
        explanation:
          type: string
          nullable: true

  responses:
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Authenticated but not allowed to perform this action
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Request body failed validation
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: object
                additionalProperties:
                  type: string
                example:
                  name: Name is required

security:
  - cookieAuth: []

paths:
  # ---------------- AUTH ----------------
  /auth/register:
    post:
      tags: [Auth]
      summary: Create employee account (always role employee)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, employeeId, password]
              properties:
                name:
                  type: string
                email:
                  type: string
                employeeId:
                  type: string
                password:
                  type: string
                  format: password
                skills:
                  type: array
                  items:
                    type: string
              example:
                name: Tushar Bhardwaj
                email: tushar@staffwise.com
                employeeId: 1433
                password: Staffwise1!
                skills: [React, Node.js, TypeScript]
      responses:
        '201':
          description: Account created. JWT is set in a `token` cookie.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Email or employeeId already in use

  /auth/login:
    post:
      tags: [Auth]
      summary: Authenticate and issue JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
                  format: password
              example:
                email: tushar@staffwise.com
                password: password123
      responses:
        '200':
          description: Logged in. JWT is set in a `token` cookie.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Invalid credentials

  /auth/logout:
    post:
      tags: [Auth]
      summary: Clear session (clears the token cookie — stateless)
      security: []
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Logged out

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current authenticated user
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ---------------- USERS ----------------
  /users:
    get:
      tags: [Users]
      summary: List all employees (Admin only)
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
        '403':
          $ref: '#/components/responses/Forbidden'

  /users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Users]
      summary: Get profile (Admin any, Employee self only)
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Users]
      summary: Update profile/skills (Admin any, Employee self only)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                skills:
                  type: array
                  items:
                    type: string
              example:
                name: Tushar Bhardwaj
                skills: [React, Node.js, TypeScript, MongoDB]
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/{id}/role:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    put:
      tags: [Users]
      summary: Change role (Admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [admin, employee]
              example:
                role: admin
      responses:
        '200':
          description: Role updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/{id}/history:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Users]
      summary: Past projects for a user (Admin any, Employee self only)
      responses:
        '200':
          description: Project history
          content:
            application/json:
              schema:
                type: object
                properties:
                  history:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ---------------- TEAMS ----------------
  /teams:
    get:
      tags: [Teams]
      summary: List teams (Admin only)
      responses:
        '200':
          description: List of teams
          content:
            application/json:
              schema:
                type: object
                properties:
                  teams:
                    type: array
                    items:
                      $ref: '#/components/schemas/Team'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Teams]
      summary: Create a team (Admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                members:
                  type: array
                  items:
                    type: string
              example:
                name: Dev Team
                members: ["507f1f77bcf86cd799439011", "507f1f77bcf86cd799439022"]
      responses:
        '201':
          description: Team created
          content:
            application/json:
              schema:
                type: object
                properties:
                  team:
                    $ref: '#/components/schemas/Team'
        '400':
          description: Validation failed or team name already exists
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error'
                  - type: object
                    properties:
                      errors:
                        type: object
                        additionalProperties:
                          type: string
        '403':
          $ref: '#/components/responses/Forbidden'

  /teams/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Teams]
      summary: Team detail (Admin and Employee)
      responses:
        '200':
          description: Team detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  team:
                    $ref: '#/components/schemas/Team'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Teams]
      summary: Edit team (Admin only)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                members:
                  type: array
                  items:
                    type: string
              example:
                name: Dev Team
                members: ["507f1f77bcf86cd799439011", "507f1f77bcf86cd799439022"]
      responses:
        '200':
          description: Team updated
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Teams]
      summary: Delete team (Admin only)
      responses:
        '200':
          description: Team deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /teams/{id}/members:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Teams]
      summary: Add member to team (Admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId:
                  type: string
              example:
                userId: "507f1f77bcf86cd799439011"
      responses:
        '200':
          description: Member added
          content:
            application/json:
              schema:
                type: object
                properties:
                  team:
                    $ref: '#/components/schemas/Team'
        '400':
          description: User already a member
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /teams/{id}/members/{userId}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: userId
        in: path
        required: true
        schema:
          type: string
    delete:
      tags: [Teams]
      summary: Remove member from team (Admin only)
      responses:
        '200':
          description: Member removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  team:
                    $ref: '#/components/schemas/Team'
        '400':
          description: User is not a member
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------- HISTORY ----------------
  /history/reflections:
    post:
      tags: [History]
      summary: Submit an employee reflection (Employee only)
      description: >
        `employeeId` is required by validation but is always overwritten server-side
        with the authenticated user's id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [employeeId, projectId, whatBuilt, whatWentWell, whatWentWrong, skillsGainedOrUsed]
              properties:
                employeeId:
                  type: string
                projectId:
                  type: string
                whatBuilt:
                  type: string
                  minLength: 10
                whatWentWell:
                  type: string
                  minLength: 10
                whatWentWrong:
                  type: string
                  minLength: 10
                skillsGainedOrUsed:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: Reflection submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  reflection:
                    $ref: '#/components/schemas/Reflection'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'

  /history/validations:
    post:
      tags: [History]
      summary: Submit an admin validation (Admin only)
      description: >
        `adminId` is required by validation but is always overwritten server-side
        with the authenticated user's id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [adminId, projectId, employeeId, performanceScores, skillValidation, qualitativeNote]
              properties:
                adminId:
                  type: string
                projectId:
                  type: string
                employeeId:
                  type: string
                performanceScores:
                  type: object
                  required: [technical, collaboration, ownership]
                  properties:
                    technical:
                      type: number
                      minimum: 1
                      maximum: 10
                    collaboration:
                      type: number
                      minimum: 1
                      maximum: 10
                    ownership:
                      type: number
                      minimum: 1
                      maximum: 10
                skillValidation:
                  type: array
                  items:
                    type: string
                qualitativeNote:
                  type: string
                  minLength: 10
      responses:
        '201':
          description: Validation submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  validation:
                    $ref: '#/components/schemas/Validation'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'

  /history/reflections/project/{projectId}:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [History]
      summary: Get reflections for a project (Admin only)
      responses:
        '200':
          description: Reflections for the project
          content:
            application/json:
              schema:
                type: object
                properties:
                  reflections:
                    type: array
                    items:
                      $ref: '#/components/schemas/Reflection'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /history/reflections/{employeeId}/{projectId}:
    parameters:
      - name: employeeId
        in: path
        required: true
        schema:
          type: string
      - name: projectId
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [History]
      summary: Get reflection for a specific employee and project
      responses:
        '200':
          description: Reflection detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  reflection:
                    $ref: '#/components/schemas/Reflection'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /history/validations/{employeeId}/{projectId}:
    parameters:
      - name: employeeId
        in: path
        required: true
        schema:
          type: string
      - name: projectId
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [History]
      summary: Get validations for an employee and project
      responses:
        '200':
          description: Validations for the employee and project
          content:
            application/json:
              schema:
                type: object
                properties:
                  validations:
                    type: array
                    items:
                      $ref: '#/components/schemas/Validation'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /history/validations/mine/{employeeId}/{projectId}:
    parameters:
      - name: employeeId
        in: path
        required: true
        schema:
          type: string
      - name: projectId
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [History]
      summary: Get the current admin's validation for an employee and project
      responses:
        '200':
          description: Validation detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  validation:
                    $ref: '#/components/schemas/Validation'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /history/skills/{employeeId}/{projectId}:
    parameters:
      - name: employeeId
        in: path
        required: true
        schema:
          type: string
      - name: projectId
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [History]
      summary: Get validated skills for an employee and project
      responses:
        '200':
          description: Validated skills
          content:
            application/json:
              schema:
                type: object
                properties:
                  skills:
                    type: array
                    items:
                      type: string
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------- PROJECTS ----------------
  /projects:
    get:
      tags: [Projects]
      summary: List projects (scoped by role — employee sees open + assigned; admin sees all)
      responses:
        '200':
          description: List of projects
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project'
    post:
      tags: [Projects]
      summary: Create project (Admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, description, type, startDate, endDate]
              properties:
                title:
                  type: string
                description:
                  type: string
                type:
                  type: string
                  enum: [personal, company, product, client]
                requiredSkills:
                  type: array
                  items:
                    type: string
                startDate:
                  type: string
                  format: date
                endDate:
                  type: string
                  format: date
              example:
                title: Internal Analytics Dashboard
                description: A dashboard to visualize staffing utilization across teams.
                type: company
                requiredSkills: [React, Node.js, MongoDB]
                startDate: "2026-08-01"
                endDate: "2026-09-15"
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                type: object
                properties:
