openapi: 3.0.3
info:
  title: Staffwise API
  description: >
    API for Staffwise — a company platform for staffing projects with the
    right employees, via role-based Admin/Employee access, Teams, and an
    AI assistant.
  version: 1.0.0

servers:
  - url: /api
    description: Local development (relative to current host)
  - url: https://staffwise.onrender.com/api
    description: Production (Render)

tags:
  - name: Auth
  - name: Users
  - name: Teams
  - name: Projects
  - name: Teams on Projects
  - name: Preferences
  - name: Documents
  - name: Comments
  - name: AI
  - name: Admin

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
          example: Something went wrong

    User:
      type: object
      properties:
        _id:
          type: string
          example: 507f1f77bcf86cd799439011
        name:
          type: string
          example: Tushar Bhardwaj
        email:
          type: string
          format: email
          example: tushar@staffwise.com
        role:
          type: string
          enum: [admin, employee]
        employeeId:
          type: string
          example: "1433"
        skills:
          type: array
          items:
            type: string
          example: [React, Node.js, TypeScript]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Team:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
          example: Dev Team
        members:
          type: array
          items:
            oneOf:
              - type: string
              - $ref: '#/components/schemas/User'
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Project:
      type: object
      properties:
        _id:
          type: string
        title:
          type: string
          example: Internal Analytics Dashboard
        description:
          type: string
        type:
          type: string
          enum: [personal, company, product, client]
        requiredSkills:
          type: array
          items:
            type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        assignedTeams:
          type: array
          items:
            oneOf:
              - type: string
              - $ref: '#/components/schemas/Team'
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Preference:
      type: object
      properties:
        _id:
          type: string
        project:
          type: string
        employee:
          type: string
        interest:
          type: string
          enum: [interested, not-interested]
        reason:
          type: string
        createdAt:
          type: string
          format: date-time

    ProjectDocument:
      type: object
      properties:
        _id:
          type: string
        project:
          type: string
        title:
          type: string
        filename:
          type: string
        mimeType:
          type: string
        size:
          type: integer
        uploadedBy:
          type: string
        createdAt:
          type: string
          format: date-time

    Comment:
      type: object
      properties:
        _id:
          type: string
        project:
          type: string
        author:
          type: string
        title:
          type: string
          nullable: true
        content:
          type: string
        parentComment:
          type: string
          nullable: true
        upvotes:
          type: array
          items:
            type: string
        isPinned:
          type: boolean
        createdAt:
          type: string
          format: date-time

  responses:
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Authenticated but not allowed to perform this action
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Request body failed validation
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: string

security:
  - bearerAuth: []

paths:
  # ---------------- AUTH ----------------
  /auth/register:
    post:
      tags: [Auth]
      summary: Create employee account (always role employee)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, employeeId, password]
              properties:
                name:
                  type: string
                email:
                  type: string
                employeeId:
                  type: string
                password:
                  type: string
                  format: password
                skills:
                  type: array
                  items:
                    type: string
              example:
                name: Tushar Bhardwaj
                email: tushar@staffwise.com
                employeeId: "1433"
                password: password123
                skills: [React, Node.js, TypeScript]
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Email or employeeId already in use

  /auth/login:
    post:
      tags: [Auth]
      summary: Authenticate and issue JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
                  format: password
              example:
                email: tushar@staffwise.com
                password: password123
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Invalid credentials

  /auth/logout:
    post:
      tags: [Auth]
      summary: Clear session (stateless — client discards token)
      responses:
        '200':
          description: Logged out

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current authenticated user
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ---------------- USERS ----------------
  /users:
    get:
      tags: [Users]
      summary: List all employees (Admin only)
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
        '403':
          $ref: '#/components/responses/Forbidden'

  /users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Users]
      summary: Get profile (Admin any, Employee self only)
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Users]
      summary: Update profile/skills (Admin any, Employee self only)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                skills:
                  type: array
                  items:
                    type: string
              example:
                name: Tushar Bhardwaj
                skills: [React, Node.js, TypeScript, MongoDB]
      responses:
        '200':
          description: Updated user
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/{id}/role:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    put:
      tags: [Users]
      summary: Change role (Admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [admin, employee]
              example:
                role: admin
      responses:
        '200':
          description: Role updated
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/{id}/history:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Users]
      summary: Past projects for a user (Admin any, Employee self only)
      responses:
        '200':
          description: Project history
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ---------------- TEAMS ----------------
  /teams:
    get:
      tags: [Teams]
      summary: List teams (Admin only)
      responses:
        '200':
          description: List of teams
          content:
            application/json:
              schema:
                type: object
                properties:
                  teams:
                    type: array
                    items:
                      $ref: '#/components/schemas/Team'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Teams]
      summary: Create a team (Admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                members:
                  type: array
                  items:
                    type: string
              example:
                name: Dev Team
                members: ["507f1f77bcf86cd799439011", "507f1f77bcf86cd799439022"]
      responses:
        '201':
          description: Team created
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'

  /teams/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Teams]
      summary: Team detail (Admin and Employee)
      responses:
        '200':
          description: Team detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  team:
                    $ref: '#/components/schemas/Team'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Teams]
      summary: Edit team (Admin only)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                members:
                  type: array
                  items:
                    type: string
              example:
                name: Dev Team
                members: ["507f1f77bcf86cd799439011", "507f1f77bcf86cd799439022"]
      responses:
        '200':
          description: Team updated
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Teams]
      summary: Delete team (Admin only)
      responses:
        '200':
          description: Team deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /teams/{id}/members:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Teams]
      summary: Add member to team (Admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId:
                  type: string
              example:
                userId: "507f1f77bcf86cd799439011"
      responses:
        '200':
          description: Member added
        '400':
          description: User already a member
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /teams/{id}/members/{userId}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: userId
        in: path
        required: true
        schema:
          type: string
    delete:
      tags: [Teams]
      summary: Remove member from team (Admin only)
      responses:
        '200':
          description: Member removed
        '400':
          description: User is not a member
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------- PROJECTS ----------------
  /projects:
    get:
      tags: [Projects]
      summary: List projects (scoped by role — employee sees open + assigned; admin sees all)
      responses:
        '200':
          description: List of projects
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project'
    post:
      tags: [Projects]
      summary: Create project (Admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, description, type, startDate, endDate]
              properties:
                title:
                  type: string
                description:
                  type: string
                type:
                  type: string
                  enum: [personal, company, product, client]
                requiredSkills:
                  type: array
                  items:
                    type: string
                startDate:
                  type: string
                  format: date
                endDate:
                  type: string
                  format: date
              example:
                title: Internal Analytics Dashboard
                description: A dashboard to visualize staffing utilization across teams.
                type: company
                requiredSkills: [React, Node.js, MongoDB]
                startDate: "2026-08-01"
                endDate: "2026-09-15"
      responses:
        '201':
          description: Project created
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'

  /projects/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Projects]
      summary: Project detail
      responses:
        '200':
          description: Project detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  project:
                    $ref: '#/components/schemas/Project'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Projects]
      summary: Update project, incl. start/end dates (Admin only)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                type:
                  type: string
                  enum: [personal, company, product, client]
                requiredSkills:
                  type: array
                  items:
                    type: string
                startDate:
                  type: string
                  format: date
                endDate:
                  type: string
                  format: date
              example:
                title: Internal Analytics Dashboard
                description: Updated scope to include export-to-CSV support.
                type: company
                requiredSkills: [React, Node.js, MongoDB]
                startDate: "2026-08-01"
                endDate: "2026-09-30"
      responses:
        '200':
          description: Project updated
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Projects]
      summary: Delete project (Admin only)
      responses:
        '200':
          description: Project deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /projects/{id}/teams:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Teams on Projects]
      summary: Assign team to project (Admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [teamId]
              properties:
                teamId:
                  type: string
              example:
                teamId: "665f1a2b3c4d5e6f7a8b9c0d"
      responses:
        '200':
          description: Team assigned
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /projects/{id}/teams/{teamId}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: teamId
        in: path
        required: true
        schema:
          type: string
    delete:
      tags: [Teams on Projects]
      summary: Unassign team from project (Admin only)
      responses:
        '200':
          description: Team unassigned
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /projects/{id}/preference:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Preferences]
      summary: Submit/update interest (Employee only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [interest]
              properties:
                interest:
                  type: string
                  enum: [interested, not-interested]
                reason:
                  type: string
              example:
                interest: interested
                reason: I've worked with this tech stack before and want to build on it.
      responses:
        '200':
          description: Preference submitted/updated
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'

  /projects/{id}/preferences:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Preferences]
      summary: View submitted preferences (Admin only)
      responses:
        '200':
          description: List of preferences
          content:
            application/json:
              schema:
                type: object
                properties:
                  preferences:
                    type: array
                    items:
                      $ref: '#/components/schemas/Preference'
        '403':
          $ref: '#/components/responses/Forbidden'

  /projects/{id}/documents:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Documents]
      summary: Upload a file (Multer to Cloudflare R2)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, title]
              properties:
                file:
                  type: string
                  format: binary
                title:
                  type: string
              example:
                title: Requirements Specification
      responses:
        '201':
          description: Document uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  document:
                    $ref: '#/components/schemas/ProjectDocument'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      tags: [Documents]
      summary: List documents (metadata only)
      responses:
        '200':
          description: List of documents
          content:
            application/json:
              schema:
                type: object
                properties:
                  documents:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProjectDocument'

  /projects/{id}/documents/{docId}/download:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: docId
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Documents]
      summary: Stream/redirect to the file from R2
      responses:
        '200':
          description: File stream or redirect
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /projects/{id}/documents/{docId}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: docId
        in: path
        required: true
        schema:
          type: string
    delete:
      tags: [Documents]
      summary: Remove a document (metadata + R2 object) — Admin any, Employee own upload only
      responses:
        '200':
          description: Document removed
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /projects/{id}/comments:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Comments]
      summary: List comments (pinned first, one level of replies) — requires team membership
      responses:
        '200':
          description: List of comments
          content:
            application/json:
              schema:
                type: object
                properties:
                  comments:
                    type: array
                    items:
                      $ref: '#/components/schemas/Comment'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Comments]
      summary: Post a comment (optionally a reply) — requires team membership
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                title:
                  type: string
                  description: Required for top-level topics, omit for replies
                content:
                  type: string
                parentComment:
                  type: string
              examples:
                topLevelTopic:
                  summary: New top-level topic
                  value:
                    title: Kickoff discussion
                    content: When are we planning to start the sprint?
                reply:
                  summary: Reply to an existing comment
                  value:
                    content: I think we should start next Monday.
                    parentComment: "665f1a2b3c4d5e6f7a8b9c0e"
      responses:
        '201':
          description: Comment created
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'

  /projects/{id}/comments/{commentId}/upvote:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: commentId
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Comments]
      summary: Toggle upvote for current user
      responses:
        '200':
          description: Upvote toggled
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /projects/{id}/comments/{commentId}/pin:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: commentId
        in: path
        required: true
        schema:
          type: string
    put:
      tags: [Comments]
      summary: Pin this comment (Admin only)
      responses:
        '200':
          description: Comment pinned
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /projects/{id}/recommendations:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [AI]
      summary: AI-suggested suitable employees/teams (Admin only)
      responses:
        '200':
          description: Ranked recommendations
        '403':
          $ref: '#/components/responses/Forbidden'

  # ---------------- AI ----------------
  /ai/query:
    post:
      tags: [AI]
      summary: Ask the assistant a question (scoped by role — employee own data only, admin full context)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                context:
                  type: object
                  properties:
                    projectId:
                      type: string
              example:
                query: Which employees would be best suited for a React + Node.js project?
                context:
                  projectId: "665f1a2b3c4d5e6f7a8b9c0d"
      responses:
        '200':
          description: AI response
          content:
